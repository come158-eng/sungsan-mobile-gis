name: Sungsan Android APK (manual and isolated)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "APK 종류: 내부 시험용 디버그키 또는 보호된 성산 배포서명"
        required: true
        default: test_only
        type: choice
        options:
          - test_only
          - signed_release

# Deny every GITHUB_TOKEN permission by default. Jobs opt into only what they
# require. This workflow never publishes to Play, S3, Sentry or Releases.
permissions: {}

concurrency:
  group: sungsan-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_arm64:
    name: Build Sungsan arm64 signing input
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      unsigned_release_artifact_id: ${{ steps.upload_unsigned.outputs.artifact-id }}
      source_revision: ${{ github.sha }}

    steps:
      # actions/checkout v6.1.0 - official GitHub verified release commit.
      - name: Checkout the selected source without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      # ZIP extraction and GitHub Desktop on Windows do not preserve Unix
      # executable bits. Restore only the reviewed build entry points before
      # any source-controlled script is executed.
      - name: Restore reviewed build script permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 \
            scripts/build.sh \
            scripts/build-vcpkg.sh \
            scripts/build-sungsan-android.sh \
            scripts/validate-sungsan-keystore.sh \
            scripts/sign-sungsan-release-apk.sh

      - name: Run source, signing and workflow gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-sungsan-android-workflow.py
          python3 scripts/check-sungsan-android-signing.py
          python3 scripts/check-sungsan-native-ui.py
          python3 scripts/check-android-compressed-export.py
          python3 scripts/check-android-project-archive-import.py
          python3 scripts/check-android-package-id.py
          bash -n scripts/build.sh
          bash -n scripts/build-vcpkg.sh
          bash -n scripts/build-sungsan-android.sh
          bash -n scripts/validate-sungsan-keystore.sh
          bash -n scripts/sign-sungsan-release-apk.sh

      # No secret is referenced before this check. A fork PR, tag or
      # non-default branch cannot enter any secret-bearing step.
      - name: Restrict secret-bearing builds to the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "Manual APK builds are allowed only on the default branch." >&2
            exit 7
          fi

      - name: Check required VWorld secret
        shell: bash
        env:
          VWORLD_KEY: ${{ secrets.SUNG_SAN_VWORLD_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${VWORLD_KEY:-}" ]]; then
            echo "Required repository secret is missing: SUNG_SAN_VWORLD_API_KEY" >&2
            exit 2
          fi

      - name: Reclaim build disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          docker system prune --all --force

      - name: Enforce minimum free space
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail -k "${GITHUB_WORKSPACE}" | tail -n 1 | tr -d ' ')"
          minimum_kib=$((35 * 1024 * 1024))
          echo "Available build space: $((available_kib / 1024 / 1024)) GiB"
          if (( available_kib < minimum_kib )); then
            echo "At least 35 GiB of free space is required for the clean Android build." >&2
            exit 4
          fi

      - name: Build installable debug-key test APK
        if: ${{ success() && inputs.build_mode == 'test_only' }}
        shell: bash
        env:
          SUNG_SAN_VWORLD_API_KEY: ${{ secrets.SUNG_SAN_VWORLD_API_KEY }}
          SUNG_SAN_ALLOW_UNSIGNED_TEST_BUILD: "1"
          OUTPUT_DIR: ${{ runner.temp }}/sungsan-apk-output
          CACHE_DIR: ${{ runner.temp }}/sungsan-vcpkg-cache
          triplet: arm64-android
          install_qt_version: 6.10.3
        run: |
          set -euo pipefail
          mkdir -p "${CACHE_DIR}"
          ./scripts/build-sungsan-android.sh

      # This job intentionally has no release keystore, alias or password.
      - name: Build unsigned release signing input
        if: ${{ success() && inputs.build_mode == 'signed_release' }}
        shell: bash
        env:
          SUNG_SAN_VWORLD_API_KEY: ${{ secrets.SUNG_SAN_VWORLD_API_KEY }}
          SUNG_SAN_BUILD_UNSIGNED_RELEASE_ONLY: "1"
          OUTPUT_DIR: ${{ runner.temp }}/sungsan-apk-output
          CACHE_DIR: ${{ runner.temp }}/sungsan-vcpkg-cache
          triplet: arm64-android
          install_qt_version: 6.10.3
        run: |
          set -euo pipefail
          mkdir -p "${CACHE_DIR}"
          ./scripts/build-sungsan-android.sh

      - name: Validate APK and create an exact three-file artifact
        id: package
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          OUTPUT_DIR: ${{ runner.temp }}/sungsan-apk-output
          DIST_DIR: ${{ runner.temp }}/sungsan-apk-dist
        run: |
          set -euo pipefail
          if [[ "${BUILD_MODE}" == "test_only" ]]; then
            expected_pattern='DEBUG-KEY-TEST-ONLY-*.apk'
            apk_name='Sungsan-Mobile-GIS-v1.0.0-beta2-arm64-DEBUG-KEY-TEST-ONLY.apk'
            artifact_kind='debug_key_test_only'
          else
            expected_pattern='UNSIGNED-RELEASE-SIGNING-INPUT-ONLY-*.apk'
            apk_name='Sungsan-Mobile-GIS-v1.0.0-beta2-arm64-UNSIGNED-RELEASE-SIGNING-INPUT-ONLY.apk'
            artifact_kind='unsigned_release_signing_input_only'
          fi

          mapfile -d '' apk_files < <(
            find "${OUTPUT_DIR}" -maxdepth 1 -type f -name "${expected_pattern}" -print0
          )
          if (( ${#apk_files[@]} != 1 )); then
            echo "Expected exactly one ${BUILD_MODE} APK; found ${#apk_files[@]}." >&2
            exit 5
          fi

          mkdir -p "${DIST_DIR}"
          apk_path="${DIST_DIR}/${apk_name}"
          cp -- "${apk_files[0]}" "${apk_path}"

          docker run --rm \
            -v "${apk_path}:/tmp/sungsan.apk:ro" \
            qfield_and_dev bash -s -- "${BUILD_MODE}" <<'VERIFY_BUILD_APK'
          set -euo pipefail
          build_mode="$1"
          build_tools=/android-sdk/build-tools/35.0.1
          apk=/tmp/sungsan.apk

          badging="$(${build_tools}/aapt dump badging "${apk}")"
          grep -Fq "package: name='kr.co.sungsan.mobilegis' versionCode='10000002' versionName='1.0.0-sungsan-beta2'" <<<"${badging}"
          native_code="$(grep '^native-code:' <<<"${badging}")"
          [[ "${native_code}" == "native-code: 'arm64-v8a'" ]]

          mapfile -t packaged_abis < <(
            unzip -Z1 "${apk}" |
              sed -n 's#^lib/\([^/][^/]*\)/.*\.so$#\1#p' |
              LC_ALL=C sort -u
          )
          [[ ${#packaged_abis[@]} -eq 1 && "${packaged_abis[0]}" == 'arm64-v8a' ]]

          if [[ "${build_mode}" == 'test_only' ]]; then
            report="$(${build_tools}/apksigner verify --verbose --print-certs "${apk}")"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"${report}"
            grep -Fq 'CN=Android Debug' <<<"${report}"
            mapfile -t signer_digests < <(
              sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' <<<"${report}"
            )
            [[ ${#signer_digests[@]} -eq 1 ]]
          else
            if ${build_tools}/apksigner verify "${apk}" >/dev/null 2>&1; then
              echo 'Unsigned release signing input unexpectedly has a valid signature.' >&2
              exit 6
            fi
          fi
          VERIFY_BUILD_APK

          chmod 0644 "${apk_path}"
          cd "${DIST_DIR}"
          sha256sum "${apk_name}" > SHA256SUMS.txt
          {
            echo "application_id=kr.co.sungsan.mobilegis"
            echo "version_name=1.0.0-sungsan-beta2"
            echo "version_code=10000002"
            echo "abi=arm64-v8a"
            echo "artifact_kind=${artifact_kind}"
            echo "source_revision=${GITHUB_SHA}"
          } > BUILD-INFO.txt
          chmod 0644 SHA256SUMS.txt BUILD-INFO.txt

          mapfile -d '' inventory < <(find "${DIST_DIR}" -mindepth 1 -print0)
          if (( ${#inventory[@]} != 3 )); then
            echo "Artifact inventory must contain exactly three entries." >&2
            exit 8
          fi
          for inventory_path in "${inventory[@]}"; do
            if [[ ! -f "${inventory_path}" || -L "${inventory_path}" ]]; then
              echo "Artifact entries must be regular, non-symlink files." >&2
              exit 9
            fi
          done
          mapfile -t inventory_names < <(
            printf '%s\n' "${inventory[@]##*/}" | LC_ALL=C sort
          )
          expected_names=(BUILD-INFO.txt SHA256SUMS.txt "${apk_name}")
          mapfile -t expected_names < <(
            printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort
          )
          [[ "${inventory_names[*]}" == "${expected_names[*]}" ]]

          echo "dist_dir=${DIST_DIR}" >> "${GITHUB_OUTPUT}"

      # actions/upload-artifact v7.0.1 - official GitHub verified release commit.
      - name: Upload verified debug-key test artifact
        if: ${{ success() && inputs.build_mode == 'test_only' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Sungsan-Mobile-GIS-beta2-arm64-DEBUG-KEY-TEST-ONLY-${{ github.run_id }}
          path: ${{ steps.package.outputs.dist_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The immutable artifact ID, not a mutable name, crosses the trust boundary.
      # actions/upload-artifact v7.0.1 - official GitHub verified release commit.
      - name: Upload unsigned release signing input by immutable ID
        id: upload_unsigned
        if: ${{ success() && inputs.build_mode == 'signed_release' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Sungsan-Mobile-GIS-beta2-arm64-UNSIGNED-SIGNING-INPUT-${{ github.run_id }}
          path: ${{ steps.package.outputs.dist_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign_release:
    name: Approve, isolate and sign Sungsan release APK
    if: ${{ success() && inputs.build_mode == 'signed_release' }}
    needs: build_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read

    # IMPORTANT: YAML cannot require reviewers. In repository Settings, create
    # the `sungsan-release` environment, add required reviewers, disallow
    # administrator bypass, and store all four SUNG_SAN_RELEASE_* secrets there.
    environment:
      name: sungsan-release

    steps:
      # No checkout is permitted in this job. Only the immutable artifact ID is
      # downloaded. actions/download-artifact v8.0.1, official verified commit.
      - name: Download unsigned input by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build_arm64.outputs.unsigned_release_artifact_id }}
          path: ${{ runner.temp }}/sungsan-unsigned-input
          merge-multiple: true
          digest-mismatch: error

      - name: Validate exact input inventory before secret access
        shell: bash
        env:
          INPUT_DIR: ${{ runner.temp }}/sungsan-unsigned-input
          SOURCE_REVISION: ${{ needs.build_arm64.outputs.source_revision }}
        run: |
          set -euo pipefail
          apk_name='Sungsan-Mobile-GIS-v1.0.0-beta2-arm64-UNSIGNED-RELEASE-SIGNING-INPUT-ONLY.apk'
          mapfile -d '' inventory < <(find "${INPUT_DIR}" -mindepth 1 -print0)
          if (( ${#inventory[@]} != 3 )); then
            echo "Signing input must contain exactly three entries." >&2
            exit 10
          fi
          for inventory_path in "${inventory[@]}"; do
            if [[ ! -f "${inventory_path}" || -L "${inventory_path}" ]]; then
              echo "Signing input entries must be regular, non-symlink files." >&2
              exit 11
            fi
          done
          mapfile -t actual_names < <(
            printf '%s\n' "${inventory[@]##*/}" | LC_ALL=C sort
          )
          expected_names=(BUILD-INFO.txt SHA256SUMS.txt "${apk_name}")
          mapfile -t expected_names < <(
            printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort
          )
          [[ "${actual_names[*]}" == "${expected_names[*]}" ]]

          cd "${INPUT_DIR}"
          if (( $(wc -l < SHA256SUMS.txt) != 1 )); then
            echo "SHA256SUMS.txt must contain exactly one checksum." >&2
            exit 12
          fi
          read -r recorded_digest recorded_name extra < SHA256SUMS.txt
          [[ "${recorded_digest}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${recorded_name}" == "${apk_name}" && -z "${extra:-}" ]]
          actual_digest="$(sha256sum "${apk_name}" | awk '{print $1}')"
          [[ "${actual_digest}" == "${recorded_digest}" ]]

          expected_info="$(printf '%s\n' \
            'application_id=kr.co.sungsan.mobilegis' \
            'version_name=1.0.0-sungsan-beta2' \
            'version_code=10000002' \
            'abi=arm64-v8a' \
            'artifact_kind=unsigned_release_signing_input_only' \
            "source_revision=${SOURCE_REVISION}")"
          [[ "$(cat BUILD-INFO.txt)" == "${expected_info}" ]]

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          build_tools="${android_sdk}/build-tools/35.0.1"
          for tool in aapt apksigner zipalign; do
            [[ -x "${build_tools}/${tool}" ]]
          done
          apk_path="${INPUT_DIR}/${apk_name}"
          badging="$(${build_tools}/aapt dump badging "${apk_path}")"
          grep -Fq "package: name='kr.co.sungsan.mobilegis' versionCode='10000002' versionName='1.0.0-sungsan-beta2'" <<<"${badging}"
          [[ "$(grep '^native-code:' <<<"${badging}")" == "native-code: 'arm64-v8a'" ]]
          if ${build_tools}/apksigner verify "${apk_path}" >/dev/null 2>&1; then
            echo "Signing input must be unsigned." >&2
            exit 13
          fi

      - name: Materialize protected secrets and fix pre-sign certificate digest
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SUNG_SAN_RELEASE_KEYSTORE_BASE64 }}
          STOREPASS_VALUE: ${{ secrets.SUNG_SAN_RELEASE_STOREPASS }}
          KEYNAME_VALUE: ${{ secrets.SUNG_SAN_RELEASE_KEYNAME }}
          KEYPASS_VALUE: ${{ secrets.SUNG_SAN_RELEASE_KEYPASS }}
          SECRET_DIR: ${{ runner.temp }}/sungsan-release-secrets
        run: |
          set -euo pipefail
          umask 077
          for secret_variable in \
            KEYSTORE_BASE64 STOREPASS_VALUE KEYNAME_VALUE KEYPASS_VALUE; do
            if [[ -z "${!secret_variable:-}" ]]; then
              echo "A required protected Sungsan release secret is missing." >&2
              exit 14
            fi
          done
          [[ ! -e "${SECRET_DIR}" && ! -L "${SECRET_DIR}" ]]
          mkdir -m 0700 "${SECRET_DIR}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${SECRET_DIR}/keystore.p12"
          printf '%s' "${STOREPASS_VALUE}" > "${SECRET_DIR}/storepass.txt"
          printf '%s' "${KEYNAME_VALUE}" > "${SECRET_DIR}/keyname.txt"
          printf '%s' "${KEYPASS_VALUE}" > "${SECRET_DIR}/keypass.txt"
          chmod 0600 "${SECRET_DIR}"/*
          [[ -s "${SECRET_DIR}/keystore.p12" ]]

          keyname="$(<"${SECRET_DIR}/keyname.txt")"
          entry_info="${SECRET_DIR}/entry-info.txt"
          if ! LC_ALL=C keytool -list -v \
              -keystore "${SECRET_DIR}/keystore.p12" \
              -storetype PKCS12 \
              -alias "${keyname}" \
              -storepass:file "${SECRET_DIR}/storepass.txt" \
              >"${entry_info}" 2>/dev/null; then
            echo "Protected keystore password or alias validation failed." >&2
            exit 15
          fi
          grep -Fq 'Entry type: PrivateKeyEntry' "${entry_info}"

          export SUNGSAN_TEMP_VALIDATION_PASS='temporary-validation-not-a-release-secret'
          keytool -importkeystore \
            -srckeystore "${SECRET_DIR}/keystore.p12" \
            -srcstoretype PKCS12 \
            -srcstorepass:file "${SECRET_DIR}/storepass.txt" \
            -srcalias "${keyname}" \
            -srckeypass:file "${SECRET_DIR}/keypass.txt" \
            -destkeystore "${SECRET_DIR}/validation.p12" \
            -deststoretype PKCS12 \
            -deststorepass:env SUNGSAN_TEMP_VALIDATION_PASS \
            -destkeypass:env SUNGSAN_TEMP_VALIDATION_PASS \
            -destalias __sungsan_validation__ \
            -noprompt >/dev/null 2>&1
          unset SUNGSAN_TEMP_VALIDATION_PASS

          keytool -exportcert \
            -keystore "${SECRET_DIR}/keystore.p12" \
            -storetype PKCS12 \
            -alias "${keyname}" \
            -storepass:file "${SECRET_DIR}/storepass.txt" \
            -file "${SECRET_DIR}/certificate.der" >/dev/null 2>&1
          certificate_digest="$(sha256sum "${SECRET_DIR}/certificate.der" | awk '{print $1}')"
          [[ "${certificate_digest}" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "${certificate_digest}" > "${SECRET_DIR}/prebuild-certificate.sha256"
          chmod 0400 "${SECRET_DIR}/prebuild-certificate.sha256"
          rm -f -- "${entry_info}" "${SECRET_DIR}/validation.p12" "${SECRET_DIR}/certificate.der"

      - name: Align, sign and verify exactly one release signer
        id: signed
        shell: bash
        env:
          INPUT_DIR: ${{ runner.temp }}/sungsan-unsigned-input
          SECRET_DIR: ${{ runner.temp }}/sungsan-release-secrets
          SIGN_DIR: ${{ runner.temp }}/sungsan-signed-dist
          SOURCE_REVISION: ${{ needs.build_arm64.outputs.source_revision }}
        run: |
          set -euo pipefail
          umask 077
          unsigned_name='Sungsan-Mobile-GIS-v1.0.0-beta2-arm64-UNSIGNED-RELEASE-SIGNING-INPUT-ONLY.apk'
          signed_name='Sungsan-Mobile-GIS-v1.0.0-beta2-arm64-SIGNED-RELEASE.apk'
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          build_tools="${android_sdk}/build-tools/35.0.1"
          zipalign="${build_tools}/zipalign"
          apksigner="${build_tools}/apksigner"
          aapt="${build_tools}/aapt"
          keyname="$(<"${SECRET_DIR}/keyname.txt")"
          anchored_digest="$(<"${SECRET_DIR}/prebuild-certificate.sha256")"
          [[ "${anchored_digest}" =~ ^[0-9a-f]{64}$ ]]

          [[ ! -e "${SIGN_DIR}" && ! -L "${SIGN_DIR}" ]]
          mkdir -m 0700 "${SIGN_DIR}"
          aligned_apk="${RUNNER_TEMP}/sungsan-release-aligned.apk"
          signed_apk="${SIGN_DIR}/${signed_name}"
          "${zipalign}" -P 16 -f 4 \
            "${INPUT_DIR}/${unsigned_name}" "${aligned_apk}" >/dev/null
          "${zipalign}" -c -P 16 -v 4 "${aligned_apk}" >/dev/null

          "${apksigner}" sign \
            --v2-signing-enabled true \
            --ks "${SECRET_DIR}/keystore.p12" \
            --ks-key-alias "${keyname}" \
            --ks-pass "file:${SECRET_DIR}/storepass.txt" \
            --key-pass "file:${SECRET_DIR}/keypass.txt" \
            --out "${signed_apk}" \
            "${aligned_apk}"
          rm -f -- "${aligned_apk}"

          report="${RUNNER_TEMP}/sungsan-release-signature-report.txt"
          "${apksigner}" verify --verbose --print-certs "${signed_apk}" > "${report}"
          "${zipalign}" -c -P 16 -v 4 "${signed_apk}" >/dev/null
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "${report}"
          mapfile -t signer_digests < <(
            sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' "${report}" |
              tr '[:upper:]' '[:lower:]'
          )
          if (( ${#signer_digests[@]} != 1 )) ||
              [[ ! "${signer_digests[0]}" =~ ^[0-9a-f]{64}$ ]] ||
              [[ "${signer_digests[0]}" != "${anchored_digest}" ]]; then
            echo "Signed APK must have exactly the approved Sungsan signer." >&2
            exit 16
          fi
          rm -f -- "${report}"

          badging="$(${aapt} dump badging "${signed_apk}")"
          grep -Fq "package: name='kr.co.sungsan.mobilegis' versionCode='10000002' versionName='1.0.0-sungsan-beta2'" <<<"${badging}"
          [[ "$(grep '^native-code:' <<<"${badging}")" == "native-code: 'arm64-v8a'" ]]

          chmod 0644 "${signed_apk}"
          cd "${SIGN_DIR}"
          sha256sum "${signed_name}" > SHA256SUMS.txt
          {
            echo "application_id=kr.co.sungsan.mobilegis"
            echo "version_name=1.0.0-sungsan-beta2"
            echo "version_code=10000002"
            echo "abi=arm64-v8a"
            echo "artifact_kind=signed_release"
            echo "source_revision=${SOURCE_REVISION}"
            echo "signer_certificate_sha256=${anchored_digest}"
          } > BUILD-INFO.txt
          chmod 0644 SHA256SUMS.txt BUILD-INFO.txt

          mapfile -d '' inventory < <(find "${SIGN_DIR}" -mindepth 1 -print0)
          if (( ${#inventory[@]} != 3 )); then
            echo "Signed artifact must contain exactly three entries." >&2
            exit 17
          fi
          for inventory_path in "${inventory[@]}"; do
            [[ -f "${inventory_path}" && ! -L "${inventory_path}" ]]
          done
          mapfile -t actual_names < <(
            printf '%s\n' "${inventory[@]##*/}" | LC_ALL=C sort
          )
          expected_names=(BUILD-INFO.txt SHA256SUMS.txt "${signed_name}")
          mapfile -t expected_names < <(
            printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort
          )
          [[ "${actual_names[*]}" == "${expected_names[*]}" ]]
          echo "dist_dir=${SIGN_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Remove protected signing material
        if: ${{ always() }}
        shell: bash
        env:
          SECRET_DIR: ${{ runner.temp }}/sungsan-release-secrets
        run: |
          set -euo pipefail
          if [[ -d "${SECRET_DIR}" && ! -L "${SECRET_DIR}" ]]; then
            rm -f -- \
              "${SECRET_DIR}/keystore.p12" \
              "${SECRET_DIR}/storepass.txt" \
              "${SECRET_DIR}/keyname.txt" \
              "${SECRET_DIR}/keypass.txt" \
              "${SECRET_DIR}/prebuild-certificate.sha256" \
              "${SECRET_DIR}/entry-info.txt" \
              "${SECRET_DIR}/validation.p12" \
              "${SECRET_DIR}/certificate.der"
            rmdir -- "${SECRET_DIR}"
          fi

      # actions/upload-artifact v7.0.1 - official GitHub verified release commit.
      - name: Upload verified signed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Sungsan-Mobile-GIS-beta2-arm64-SIGNED-RELEASE-${{ github.run_id }}
          path: ${{ steps.signed.outputs.dist_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
